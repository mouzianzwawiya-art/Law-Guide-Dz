function login(){state.page='login';renderApp();return '';} function loginView(){return '<div class="screen"><div class="top"><button class="back" onclick="welcome()">'+icon('back')+' العودة</button><div class="brand">Law Guide</div><span></span></div><div class="auth"><div class="auth-head">'+mark()+'<h1>تسجيل الدخول</h1><p class="muted">ادخل إلى حسابك للمتابعة.</p></div><div class="field"><label>البريد الإلكتروني أو رقم الهاتف</label><input id="lemail" placeholder="البريد الإلكتروني أو الهاتف"></div><div class="field"><label>كلمة المرور</label><input id="lpass" type="password" placeholder="كلمة المرور"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="doLogin()">تسجيل الدخول</button><button class="back" style="width:100%;margin-top:12px" onclick="register()">إنشاء حساب جديد</button><div class="notice" style="margin-top:20px">هذه نسخة تجريبية محلية. التحقق الفعلي من الهوية والحسابات متعددة الأجهزة يحتاج إلى خادم آمن وربط رسمي مع خدمات التحقق المناسبة.</div></div></div>'}
function createAccount(){var n=document.getElementById('rname').value.trim(),p=document.getElementById('rphone').value.trim(),e=document.getElementById('remail').value.trim(),c=document.getElementById('rcni').value.trim(),b=document.getElementById('rbirth').value,pass=document.getElementById('rpass').value,pass2=document.getElementById('rpass2').value;if(!n||!p||!e||!c||!b||!pass||pass!==pass2){toast('يرجى إكمال جميع البيانات والتأكد من تطابق كلمتي المرور.');return}var acc={name:n,phone:p,email:e,cniLast:c.slice(-4),birth:b,password:pass};localStorage.setItem('lawguideAccount',JSON.stringify(acc));state.account=acc;state.logged=true;state.page='home';renderApp();toast('تم إنشاء الحساب محليًا.');}

function home(){return shell('<div class="content"><div class="eyebrow">مرحبًا'+(state.account?', '+escapeHtml(state.account.name):' بك')+'</div><h1 class="title">ما الإجراء الذي تبحث عنه؟</h1><p class="subtitle">ابحث بلغة بسيطة، ثم اتبع الخطوات والوثائق المطلوبة.</p><div class="searchbox"><input id="homeSearch" placeholder="مثال: أريد بناء منزل"><button class="searchbtn" onclick="runSearch()">'+icon('search')+'</button></div><div class="section-head"><h2>الإجراءات الأكثر استعمالًا</h2><button onclick="categories()">المجالات القانونية</button></div><div class="grid"><div class="card" onclick="quickProcedure(0)">'+icon('home')+'<b>رخصة البناء</b><small>خطوات وملف الإجراء</small></div><div class="card" onclick="quickProcedure(1)">'+icon('doc')+'<b>شهادة التعمير</b><small>الوثائق والجهة المختصة</small></div><div class="card" onclick="quickProcedure(2)">'+icon('more')+'<b>التقسيم العقاري</b><small>المراحل والوثائق</small></div><div class="card" onclick="quickProcedure(3)">'+icon('home')+'<b>الملكية العقارية</b><small>إثبات وتسجيل الملكية</small></div></div><div class="section-head"><h2>كيف يعمل Law Guide؟</h2></div><div class="list"><div class="list-item"><div class="list-icon">'+icon('search')+'</div><div class="grow"><b>1. اختر الإجراء</b><small>ابدأ بما تريد القيام به بدل البحث عن المصطلح القانوني.</small></div></div><div class="list-item"><div class="list-icon">'+icon('doc')+'</div><div class="grow"><b>2. جهّز ملفك</b><small>ستجد الوثائق والأسئلة المطلوبة خطوة بخطوة.</small></div></div><div class="list-item"><div class="list-icon">'+icon('check')+'</div><div class="grow"><b>3. تابع الإجراء</b><small>راجع المراحل والمصدر القانوني وآخر تحديث.</small></div></div></div><div class="notice" style="margin-top:18px">معلومة مهمة: الإجراءات والوثائق قد تختلف حسب الحالة والجهة المختصة. تحقق دائمًا من المصدر الرسمي قبل الإيداع.</div></div>')}

function procedure(){var i=state.cat||0;return shell('<div class="content"><button class="back" onclick="categoryNav()">'+icon('back')+' العقار والتعمير</button><div class="procedure-head"><div class="eyebrow">الإجراء</div><h1 class="title" style="font-size:23px">'+procedures[i]+'</h1><p class="subtitle">مسار إرشادي مبسط للمستخدم.</p></div><div class="steps">'+['الأسئلة','الوثائق','المراحل','المصدر'].map(function(x,j){return '<div class="step '+(state.step===j+1?'active':'')+'"><span>'+ (j+1) +'</span>'+x+'</div>'}).join('')+'</div>'+procedureBody(i)+'</div>')}
function procedureBody(i){if(i!==0)return '<div class="notice">هذا الإجراء مهيأ داخل الهيكل، وسيتم ربط تفاصيله بالمصادر الرسمية عند إعداد محتواه.</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="state.step=4;renderApp()">عرض المصدر</button>';if(state.step===1)return '<div class="question"><h3>هل أنت مالك العقار؟</h3><label class="choice selected"><input type="radio" name="owner" checked> نعم، أنا مالك العقار</label><label class="choice"><input type="radio" name="owner"> لا، أمثل المالك</label></div><div class="question"><h3>نوع المشروع</h3><label class="choice selected"><input type="radio" name="project" checked> بناء جديد</label><label class="choice"><input type="radio" name="project"> توسعة أو تعديل</label></div><button class="btn primary" style="width:100%" onclick="state.step=2;renderApp()">التالي</button>';if(state.step===2)return '<div class="question"><h3>الوثائق المطلوبة</h3><div class="check"><input type="checkbox"> <div><b>طلب رخصة البناء</b><small class="muted">النموذج المعتمد لدى الجهة المختصة.</small></div></div><div class="check"><input type="checkbox"> <div><b>وثيقة الملكية</b><small class="muted">حسب طبيعة العقار والملف.</small></div></div><div class="check"><input type="checkbox"> <div><b>مخطط الموقع</b><small class="muted">يحدد موقع المشروع.</small></div></div><div class="check"><input type="checkbox"> <div><b>المخطط التقني للمشروع</b><small class="muted">وفق المتطلبات المعمول بها.</small></div></div><div class="check"><input type="checkbox"> <div><b>وثائق إضافية حسب الحالة</b><small class="muted">قد تطلب الجهة المختصة وثائق أخرى.</small></div></div></div><div class="notice">القائمة أعلاه نموذج توضيحي وليست قائمة رسمية نهائية. يجب التأكد من البلدية أو الجهة المختصة قبل الإيداع.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="state.step=3;renderApp()">التالي</button>';if(state.step===3)return '<div class="question"><h3>مراحل الإجراء</h3><div class="timeline"><div class="stage done"><span class="dot"></span><h4>تحضير الوثائق</h4><p>مراجعة الملف وتجهيز الوثائق المطلوبة.</p></div><div class="stage"><span class="dot"></span><h4>إيداع الملف</h4><p>لدى الجهة المختصة حسب الحالة.</p></div><div class="stage"><span class="dot"></span><h4>دراسة الملف</h4><p>تتم دراسة الطلب وفق الإجراءات المعمول بها.</p></div><div class="stage"><span class="dot"></span><h4>استلام القرار</h4><p>بعد انتهاء دراسة الملف.</p></div></div></div><button class="btn primary" style="width:100%" onclick="state.step=4;renderApp()">التالي</button>';return '<div class="source"><h3 style="margin-top:0">الأساس القانوني</h3><p>يجب ربط هذا الإجراء بالنصوص القانونية والتنظيمية الرسمية المعتمدة قبل نشره كمعلومة قانونية.</p><p><b>آخر تحديث:</b> يُحدد عند ربط المصدر الرسمي.</p><button class="btn secondary" style="width:100%" onclick="toast(\'سيتم فتح المصدر الرسمي بعد ربطه.\')">عرض المصدر القانوني</button></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveProcedure()">'+(state.saved?'محفوظ بالفعل':'حفظ الإجراء')+'</button>'}
function saveProcedure(){state.saved=true;localStorage.setItem('lawguideSaved','1');renderApp();toast('تم حفظ الإجراء في محفوظاتك.');}

function cat(i){state.domain=i;state.cat=0;state.step=1;state.page='category';renderApp()}
function category(){var d=lawDomains[state.domain||0]||lawDomains[0];return shell('<div class="content"><button class="back" onclick="categories()">'+icon('back')+' المجالات</button>'+domainCardVisual(state.domain||0)+'<h1 class="title">'+escapeHtml(d.name)+'</h1><p class="subtitle">'+escapeHtml(d.desc)+'</p><div class="list">'+d.items.map(function(p,i){return '<div class="list-item" onclick="procedureNav('+(state.domain||0)+','+i+')"><div class="list-icon">'+icon(i%2?'doc':'home')+'</div><div class="grow"><b>'+escapeHtml(p)+'</b><small>اضغط لعرض الأسئلة والوثائق والمراحل والمصدر.</small></div><span class="arrow">›</span></div>'}).join('')+'</div></div>')}
function categoryNav(){state.page='category';renderApp()}

function procedureView(){var p=currentProcedure(),d=lawDomains[p.catIndex]||lawDomains[0],info=procedureDetails[p.title]||{q:['ما الهدف من هذا الإجراء؟','هل لديك الوثائق الأساسية المرتبطة بطلبك؟'],docs:['وثيقة هوية','الطلب أو الاستمارة','وثائق داعمة حسب الحالة'],st:['تحديد الطلب','تحضير الملف','إيداع الطلب','متابعة النتيجة']};var visual=domainVisuals[p.catIndex]||domainVisuals[7];return shell('<div class="content"><button class="back" onclick="categoryNav()">'+icon('back')+' '+escapeHtml(d.name)+'</button><div class="procedure-head"><div class="eyebrow">المسار '+(p.idx+1)+'</div><h1 class="title" style="font-size:23px">'+escapeHtml(p.title)+'</h1><p class="subtitle">محتوى إرشادي مخصص لهذا الإجراء.</p></div><div class="procedure-visual" style="background-image:url(\''+visual.image+'\')"><b>'+escapeHtml(d.name)+'</b></div><div class="steps">'+['الأسئلة','الوثائق','المراحل','المصدر'].map(function(x,j){return '<div class="step '+(state.step===j+1?'active':'')+'"><span>'+(j+1)+'</span>'+x+'</div>'}).join('')+'</div>'+procedureBodyUnique(p,info)+'</div>')}

function procedureBodyUnique(p,info){if(state.step===1){var a=questionChoices[p.title]||['نعم، هذا هو وضعي','أحتاج توجيها حسب حالتي','نعم، لدي المعلومات المطلوبة','لا، أحتاج التحقق منها'];return '<div class="question"><h3>أسئلة مرتبطة بـ '+escapeHtml(p.title)+'</h3><p>'+escapeHtml(info.q[0])+'</p><label class="choice selected"><input type="radio" name="q1" checked> '+escapeHtml(a[0])+'</label><label class="choice"><input type="radio" name="q1"> '+escapeHtml(a[1])+'</label><p style="margin-top:14px">'+escapeHtml(info.q[1])+'</p><label class="choice"><input type="radio" name="q2"> '+escapeHtml(a[2])+'</label><label class="choice"><input type="radio" name="q2"> '+escapeHtml(a[3])+'</label><button class="btn primary" style="width:100%;margin-top:8px" onclick="state.step=2;renderApp()">التالي</button></div>';}if(state.step===2)return '<div class="question"><h3>الوثائق المطلوبة لهذا الإجراء</h3>'+info.docs.map(function(x){return '<div class="check"><input type="checkbox"><div><b>'+escapeHtml(x)+'</b><small class="muted">قد تختلف الوثيقة حسب الحالة والجهة المختصة.</small></div></div>'}).join('')+'<button class="btn primary" style="width:100%;margin-top:12px" onclick="state.step=3;renderApp()">التالي</button></div>';if(state.step===3)return '<div class="question"><h3>مراحل '+escapeHtml(p.title)+'</h3><div class="timeline">'+info.st.map(function(x,i){return '<div class="stage '+(i===0?'done':'')+'"><span class="dot"></span><h4>'+(i+1)+'. '+escapeHtml(x)+'</h4><p>راجع المتطلبات الرسمية لهذه المرحلة قبل الانتقال إلى التالية.</p></div>'}).join('')+'</div><button class="btn primary" style="width:100%" onclick="state.step=4;renderApp()">التالي</button></div>';return '<div class="source"><h3 style="margin-top:0">الأساس القانوني والمصدر</h3><p>يجب اعتماد النصوص الرسمية السارية الخاصة بـ <b>'+escapeHtml(p.title)+'</b> قبل اتخاذ أي إجراء.</p><p><b>آخر تحديث:</b> محتوى إرشادي أولي، ويجب مراجعته مع الجهة الرسمية قبل الإيداع.</p><button class="btn secondary" style="width:100%" onclick=" function saveProcedure(){var p=currentProcedure(),a=readSaved();if(a.indexOf(p.title)<0)a.push(p.title);localStorage.setItem('lawguideSavedList',JSON.stringify(a));renderApp();toast('تم حفظ الإجراء في محفوظاتك.')}
function openSaved(title){var p=allProcedures.find(function(x){return x.title===title});if(p){state.domain=p.catIndex;state.cat=p.idx;state.step=1;state.page='procedure';renderApp()}}
